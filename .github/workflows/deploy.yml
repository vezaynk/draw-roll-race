name: Test and deploy

# Pull requests: checks, then a preview deployment with its own URL (deleted when the PR closes).
# Pushes to master: checks, then deploy to production.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (physics replays, courses, limbs, validation, moderation)
        run: npm run test:unit

      - name: Every kind of course can be finished (and the tutorial CPU finishes it)
        run: npm run sim -- 10 10 10

      - name: Worker builds
        run: npx wrangler deploy --dry-run --outdir dist

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Browser tests (rooms, reconnecting, cheating, solo, daily, passkeys)
        run: npm run test:e2e
        env:
          E2E_SHOW_SERVER_LOG: '1'

  preview:
    needs: test
    # Secrets are not available to pull requests from forks.
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Deploy preview
        id: preview
        run: |
          npx wrangler preview --name "pr-${{ github.event.pull_request.number }}" --message "$PR_TITLE" | tee preview.log
          url=$(grep -oE 'https://[^ ]+\.workers\.dev[^ ]*' preview.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Check the preview answers
        if: steps.preview.outputs.url != ''
        run: curl --fail --show-error --silent --retry 5 --retry-delay 3 "${{ steps.preview.outputs.url }}/api/health"

      - name: Post the preview link on the pull request
        if: steps.preview.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        with:
          script: |
            const marker = '<!-- draw-roll-race-preview -->';
            const body = `${marker}\n**Preview:** ${process.env.PREVIEW_URL}\n\nUpdated for ${context.sha.slice(0, 7)}. It has its own rooms and its own daily leaderboard, separate from production.`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.body && c.body.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Delete preview
        run: npx wrangler preview delete --name "pr-${{ github.event.pull_request.number }}" --skip-confirmation || echo "No preview to delete."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    # Never run two deploys at once; a newer push waits for the one in progress.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Check production answers
        run: curl --fail --show-error --silent --retry 5 --retry-delay 3 "${{ steps.deploy.outputs.deployment-url }}/api/health"
